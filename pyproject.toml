[project]
name = "data-generation"
version = "0.1.0"
description = "GDPR-compliant synthetic face dataset generator using ByteDance/SDXL-Lightning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.10.0",
    "diffusers>=0.36.0",
    "transformers>=4.57.6",
    "accelerate>=1.12.0",
    "sentencepiece>=0.2.1",
    "protobuf>=6.33.4",
    "pillow>=12.1.0",
    "numpy>=2.4.1",
    "tqdm>=4.67.1",
    "safetensors>=0.7.0",
    "huggingface-hub>=0.36.0",
]
