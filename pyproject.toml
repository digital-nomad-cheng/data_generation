[project]
name = "data-generation"
version = "0.1.0"
description = "GDPR-compliant synthetic face dataset generator using ByteDance/SDXL-Lightning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "diffusers>=0.36.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "sentencepiece>=0.2.0",
    "protobuf>=3.20.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
]
